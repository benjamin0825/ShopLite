{% extends "base.html" %}

{% block title %}Log in | ShopLite{% endblock %}

{% block content %}
<div class="form-card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
